server.port=8081
spring.application.name=demooutboxinbox

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:sqlserver://localhost:${MSSQL_PORT:1433};databaseName=master;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${MSSQL_SA_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

outbox.relay.enabled=false
outbox.relay.exchange=mensageria.outbox
outbox.relay.confirm-timeout=5s
outbox.relay.backoff.initial=200ms
outbox.relay.backoff.multiplier=2.0
outbox.relay.backoff.max=30s
outbox.relay.batch-size=100

logging.pattern.level=%5p [messageId=%X{messageId:-} correlationId=%X{correlationId:-} aggregateKey=%X{aggregateKey:-} traceId=%X{traceId:-}]

management.endpoint.health.show-components=always
