  #  depends_on:
  #    rabbitmq:
 #       condition: service_healthy
 #   ports:
 #     - "${TOXIPROXY_API_PORT:-8474}:8474"
 #     - "${TOXIPROXY_RABBITMQ_PORT:-8666}:8666"
 #   volumes:
 #     - ./docker/toxiproxy.json:/config/toxiproxy.json:ro
 #   healthcheck:
 #     test: ["CMD", "/toxiproxy-cli", "list"]
 #     interval: 5s
 #     timeout: 3s
 #     retries: 10

volumes:
  sqlserver-data:
  rabbitmq-data:
